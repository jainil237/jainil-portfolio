<div #cursor class="cursor-ring">
  <svg class="cursor-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
    stroke-linejoin="round">
    <line x1="7" y1="17" x2="17" y2="7"></line>
    <polyline points="7 7 17 7 17 17"></polyline>
  </svg>
</div>

<!-- Trailing Elements -->
<div *ngFor="let i of trailCount; let idx = index" #trail class="cursor-trail" [class.trail-small]="idx > 2"></div>
